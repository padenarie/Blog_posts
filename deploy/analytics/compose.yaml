services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    expose: ["80"]
    environment:
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-}
    volumes:
      - request_logs:/var/log/nginx/analytics
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [analytics]

  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: umami
      POSTGRES_DB: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [analytics]

  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL:-}
      APP_SECRET: ${UMAMI_APP_SECRET:-}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/script.js').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [analytics]

  collector:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    environment:
      ANALYTICS_DB: /data/requests.sqlite
      ANALYTICS_LOG_DIR: /logs
    volumes:
      - request_logs:/logs:ro
      - collector_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os; assert os.path.isfile('/data/requests.sqlite')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [analytics]

  report:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    command: ["python", "-m", "analytics.report"]
    environment:
      ANALYTICS_DB: /data/requests.sqlite
    volumes:
      - collector_data:/data
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on: [collector]
    restart: unless-stopped
    networks: [analytics]

  report-gateway:
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    environment:
      REPORT_HTPASSWD_B64: ${REPORT_HTPASSWD_B64:-}
    volumes:
      - ./deploy/analytics/report-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /run/secrets:mode=0700,size=64k
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        : "$${REPORT_HTPASSWD_B64:?set REPORT_HTPASSWD_B64}"
        printf '%s' "$$REPORT_HTPASSWD_B64" | base64 -d > /run/secrets/report_htpasswd
        chown nginx:nginx /run/secrets /run/secrets/report_htpasswd
        unset REPORT_HTPASSWD_B64
        exec nginx -g 'daemon off;'
    expose: ["80"]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on: [report]
    restart: unless-stopped
    networks: [analytics]

volumes:
  request_logs:
  collector_data:
  postgres_data:

networks:
  analytics:
