server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    # Short TTL: asset filenames are not content-hashed, so a long/immutable
    # cache would serve stale CSS/JS to returning visitors after a redeploy.
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html $uri/ /404.html;
  }
}
