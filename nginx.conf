map $http_referer $analytics_referrer_host {
  default "";
  ~^https?://([^/:?#]+) $1;
}

map $request_uri $analytics_path {
  ~^([^?]*) $1;
  default "";
}

log_format analytics escape=json '{"time":"$time_iso8601","path":"$analytics_path","method":"$request_method","status":$status,"referrer_host":"$analytics_referrer_host","user_agent":"$http_user_agent","client_address":"$remote_addr"}';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/real-ip/*.conf;
  access_log /var/log/nginx/analytics/page.jsonl analytics;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    # Short TTL: asset filenames are not content-hashed, so a long/immutable
    # cache would serve stale CSS/JS to returning visitors after a redeploy.
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
